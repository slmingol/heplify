name: Package check

# Build the deb/rpm the way the release does and run static checks on them
# (scripts/check_package.sh). Only when packaging inputs change.
on:
  pull_request:
    paths:
      - nfpm.yaml
      - .goreleaser.yml
      - Makefile
      - examples/**
      - scripts/**
      - .github/workflows/package-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flex bison lintian rpmlint rpm shellcheck

      # Same key as release.yml, so both workflows share the cache.
      - name: Cache local libpcap
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/libpcap
          key: libpcap-1.10.4-amd64-${{ runner.os }}

      - name: Build packages
        run: make package VERSION=0.0.0

      - name: Check packages
        run: ./scripts/check_package.sh heplify-0.0.0-amd64.deb heplify-0.0.0-amd64.rpm
