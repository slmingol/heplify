name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - "feat/**"
      - "fix/**"
      - "ci/**"
      - "test/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libpcap-dev

      - name: Download Go modules
        run: go mod download

      - name: gofmt check
        run: make fmt-check

      - name: go vet
        run: make lint

      - name: Unit tests
        run: make test

      - name: Race tests
        run: make test-race

      - name: Coverage
        run: make test-coverage

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libpcap-dev

      - name: Download Go modules
        run: go mod download

      - name: gofmt check
        run: make fmt-check

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.4
          args: --timeout=5m

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debian_release: [trixie, bookworm]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: |
          docker build -f docker/Dockerfile \
            --build-arg DEBIAN_RELEASE=${{ matrix.debian_release }} \
            -t heplify:ci-${{ matrix.debian_release }} .

      - name: Smoke test
        run: docker run --rm --cap-add NET_RAW --cap-add NET_ADMIN heplify:ci-${{ matrix.debian_release }} -version
